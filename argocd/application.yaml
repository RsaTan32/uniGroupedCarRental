apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grouped-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RsaTan32/uniGroupedCarRental.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: car-rental
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
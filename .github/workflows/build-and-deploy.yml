name: Build and deploy Quarkus image

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    packages: write

concurrency:
    group: quarkus-deploy-main
    cancel-in-progress: true

jobs:
    build-publish-update:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Make Maven wrapper executable
              run: chmod +x mvnw

            - name: Test and package Quarkus application
              run: ./mvnw -B verify

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: src/main/docker/Dockerfile.jvm
                  push: true
                  tags: ghcr.io/rsatan32/unigroupedcarrental:${{ github.sha }}
                  labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

            - name: Update image tag for Argo CD
              uses: mikefarah/yq@master
              env:
                  IMAGE_TAG: ${{ github.sha }}
              with:
                  cmd: yq -i '.images[0].newTag = env(IMAGE_TAG)' k8s/overlays/prod/kustomization.yaml

            - name: Commit image tag update
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "chore(deploy): use image ${{ github.sha }}"
                  file_pattern: k8s/overlays/prod/kustomization.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grouped-backend
  labels:
    app.kubernetes.io/name: grouped-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: grouped-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grouped-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grouped-backend
          image: grouped-backend:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: grouped-backend-config
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
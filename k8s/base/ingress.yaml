apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grouped-backend
  labels:
    app.kubernetes.io/name: grouped-backend
spec:
  ingressClassName: traefik
  rules:
    - host: api.pistidevops.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grouped-backend
                port:
                  name: http